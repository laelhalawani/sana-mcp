name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Three commits pushed in a minute used to mean three full runs, two of them
# already answering a question nobody was asking any more. Only the newest is
# kept. Deliberately not applied to release.yml or autorelease.yml: cancelling
# a run that is midway through tagging or uploading assets is how a release
# ends up half-published.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - run: go vet ./...
      # Only the raced run. It executes the same tests as a plain `go test`, so
      # running both spent minutes to learn nothing the second time.
      #
      # The live tests against the real Sana API are skipped here: they need a
      # signed-in session, which CI does not have and should not. They are run
      # locally with SANA_LIVE=1.
      - run: go test -race ./...
      - run: CGO_ENABLED=0 go build -trimpath .
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l . | grep -v '^prototypes/' || true)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

  cross-build:
    # Pull requests only. A push to main that ships a release builds all six
    # targets in release.yml minutes later, and building them here as well
    # meant every deploy compiled the same commit twice for six platforms.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - name: Build
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath .

  platform-vet:
    # The Windows process-stop path cannot run on a Linux runner, but compiling
    # and vetting it here stops it rotting silently between Windows releases.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - run: GOOS=windows GOARCH=amd64 go vet ./...
      - run: GOOS=darwin GOARCH=arm64 go vet ./...
      - name: Compile the Windows test binaries
        run: |
          for package in ./internal/daemon ./internal/store ./internal/mcpserver; do
            GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go test -c -o /dev/null "$package"
          done
