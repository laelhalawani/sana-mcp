name: release

# Build and publish an exact, manifest-bound release tuple:
#   - a v* tag push releases that package-matching tag;
#   - a main push releases v<package version> only when that tag is absent;
#   - a manual dispatch rebuilds or resumes an existing package-matching tag.
on:
  push:
    tags: ["v*"]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing package-matching tag to release (for example v0.4.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  authorize:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.verify.outputs.tag }}
      sha: ${{ steps.verify.outputs.sha }}
      skip: ${{ steps.verify.outputs.skip }}
      create_tag: ${{ steps.verify.outputs.create_tag }}
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      # oven-sh/setup-bun v2.2.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - id: verify
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          package_tag="v$(bun -e 'import p from "./package.json"; process.stdout.write(p.version)')"
          source_sha="$(git rev-parse HEAD)"
          test "${#source_sha}" -eq 40 ||
            { echo "Resolved source commit is not a full SHA" >&2; exit 1; }
          case "$source_sha" in
            *[!a-f0-9]*) echo "Resolved source commit is not lowercase hexadecimal" >&2; exit 1 ;;
          esac

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            release_tag=$REQUESTED_TAG
          elif [ "$REF_TYPE" = "tag" ]; then
            release_tag=$REF_NAME
          else
            release_tag=$package_tag
          fi

          test "$release_tag" = "$package_tag" ||
            { echo "Tag $release_tag does not match package version $package_tag" >&2; exit 1; }

          tag_probe_error="$(mktemp)"
          trap 'rm -f "$tag_probe_error"' EXIT
          resolve_tag_commit() {
            tag_name=$1
            error_file=$2
            : > "$error_file"
            if ! ref_object=$(
              gh api \
                "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag_name" \
                --jq '.object.type + " " + .object.sha' 2> "$error_file"
            ); then
              if grep -q "HTTP 404" "$error_file"; then
                return 2
              fi
              return 1
            fi
            object_type=${ref_object%% *}
            object_sha=${ref_object#* }
            if [ "$object_type" = "tag" ]; then
              if ! tag_object=$(
                gh api \
                  "repos/$GITHUB_REPOSITORY/git/tags/$object_sha" \
                  --jq '.object.type + " " + .object.sha' 2>> "$error_file"
              ); then
                return 1
              fi
              object_type=${tag_object%% *}
              object_sha=${tag_object#* }
            fi
            if [ "$object_type" != "commit" ]; then
              echo "Tag $tag_name does not resolve directly to a commit." > "$error_file"
              return 1
            fi
            test "${#object_sha}" -eq 40 ||
              { echo "Tag $tag_name resolved to an invalid commit SHA." > "$error_file"; return 1; }
            case "$object_sha" in
              *[!a-f0-9]*) echo "Tag $tag_name resolved to an invalid commit SHA." > "$error_file"; return 1 ;;
            esac
            printf '%s\n' "$object_sha"
          }

          tag_exists=false
          remote_tag_sha=""
          if remote_tag_sha=$(
            resolve_tag_commit "$release_tag" "$tag_probe_error"
          ); then
            tag_exists=true
          else
            probe_status=$?
            if [ "$probe_status" -ne 2 ]; then
              cat "$tag_probe_error" >&2
              echo "Could not determine whether $release_tag already exists." >&2
              exit 1
            fi
          fi

          create_tag=false
          if [ "$EVENT_NAME" = "push" ] && [ "$REF_TYPE" = "branch" ]; then
            if [ "$tag_exists" = "true" ]; then
              echo "$release_tag already exists; this main push has no new package version."
              echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
              echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "create_tag=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            create_tag=true
          else
            [ "$tag_exists" = "true" ] ||
              { echo "$release_tag is not an existing tag" >&2; exit 1; }
            test "$source_sha" = "$remote_tag_sha" ||
              { echo "Checkout is not the exact requested tag commit" >&2; exit 1; }
          fi

          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "create_tag=$create_tag" >> "$GITHUB_OUTPUT"

  linux:
    needs: authorize
    if: needs.authorize.outputs.skip != 'true'
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-linux-x64
            runner: ubuntu-24.04
            asset: sana-mcp-linux-x64
            libc: glibc
          - target: bun-linux-x64-musl
            runner: ubuntu-24.04
            asset: sana-mcp-linux-x64-musl
            libc: musl
          - target: bun-linux-arm64
            runner: ubuntu-24.04-arm
            asset: sana-mcp-linux-arm64
            libc: glibc
          - target: bun-linux-arm64-musl
            runner: ubuntu-24.04-arm
            asset: sana-mcp-linux-arm64-musl
            libc: musl
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.authorize.outputs.sha }}
          persist-credentials: false
      # oven-sh/setup-bun v2.2.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile --no-progress
      - name: Build through canonical release configuration
        run: bun scripts/release.ts build --target "${{ matrix.target }}" --outfile "${{ matrix.asset }}"
      - name: Execute inspect and smoke check
        env:
          TARGET: ${{ matrix.target }}
          ASSET: ${{ matrix.asset }}
          LIBC: ${{ matrix.libc }}
          SOURCE_SHA: ${{ needs.authorize.outputs.sha }}
        run: |
          set -euo pipefail
          chmod 755 "$ASSET"
          if [ "$LIBC" = musl ]; then
            docker run --rm -v "$PWD:/work:ro" -w /work \
              alpine:3.22@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce \
              sh -eu -c \
              'apk add --no-cache libstdc++ libgcc >/dev/null
              "$1" __inspect --format json
              "$1" --help >/dev/null' \
              sh "/work/$ASSET" > "inspect-$TARGET.json"
          else
            "./$ASSET" __inspect --format json > "inspect-$TARGET.json"
            "./$ASSET" --help >/dev/null
          fi
          bun scripts/release.ts attest \
            --target "$TARGET" \
            --artifact "$ASSET" \
            --inspect-file "inspect-$TARGET.json" \
            --commit-sha "$SOURCE_SHA" \
            --output "attestation-$TARGET.json"
      # actions/upload-artifact v4.6.2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 1
          path: |
            ${{ matrix.asset }}
            attestation-${{ matrix.target }}.json

  macos:
    needs: authorize
    if: needs.authorize.outputs.skip != 'true'
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-darwin-x64
            runner: macos-15-intel
            asset: sana-mcp-darwin-x64
          - target: bun-darwin-arm64
            runner: macos-15
            asset: sana-mcp-darwin-arm64
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.authorize.outputs.sha }}
          persist-credentials: false
      # oven-sh/setup-bun v2.2.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile --no-progress
      - name: Build through canonical release configuration
        run: bun scripts/release.ts build --target "${{ matrix.target }}" --outfile "${{ matrix.asset }}"
      - name: Execute inspect and smoke check
        env:
          TARGET: ${{ matrix.target }}
          ASSET: ${{ matrix.asset }}
          SOURCE_SHA: ${{ needs.authorize.outputs.sha }}
        run: |
          set -euo pipefail
          chmod 755 "$ASSET"
          "./$ASSET" __inspect --format json > "inspect-$TARGET.json"
          "./$ASSET" --help >/dev/null
          bun scripts/release.ts attest \
            --target "$TARGET" \
            --artifact "$ASSET" \
            --inspect-file "inspect-$TARGET.json" \
            --commit-sha "$SOURCE_SHA" \
            --output "attestation-$TARGET.json"
      # actions/upload-artifact v4.6.2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 1
          path: |
            ${{ matrix.asset }}
            attestation-${{ matrix.target }}.json

  windows:
    needs: authorize
    if: needs.authorize.outputs.skip != 'true'
    name: bun-windows-x64
    runs-on: windows-2022
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.authorize.outputs.sha }}
          persist-credentials: false
      # oven-sh/setup-bun v2.2.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile --no-progress
      - name: Build through canonical release configuration
        run: bun scripts/release.ts build --target bun-windows-x64 --outfile sana-mcp-windows-x64.exe
      - name: Validate the Windows installer syntax
        shell: powershell
        run: |
          $Tokens = $null
          $Errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD "install.ps1"),
            [ref] $Tokens,
            [ref] $Errors
          ) | Out-Null
          if ($Errors.Count -gt 0) {
            $Errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - name: Execute inspect and smoke check
        shell: pwsh
        env:
          SOURCE_SHA: ${{ needs.authorize.outputs.sha }}
        run: |
          & .\sana-mcp-windows-x64.exe __inspect --format json |
            Set-Content -LiteralPath inspect-bun-windows-x64.json -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw "Standalone inspect failed: $LASTEXITCODE" }
          & .\sana-mcp-windows-x64.exe --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Standalone smoke check failed: $LASTEXITCODE" }
          bun scripts/release.ts attest `
            --target bun-windows-x64 `
            --artifact sana-mcp-windows-x64.exe `
            --inspect-file inspect-bun-windows-x64.json `
            --commit-sha $env:SOURCE_SHA `
            --output attestation-bun-windows-x64.json
          if ($LASTEXITCODE -ne 0) { throw "Attestation failed: $LASTEXITCODE" }
      # actions/upload-artifact v4.6.2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-bun-windows-x64
          if-no-files-found: error
          retention-days: 1
          path: |
            sana-mcp-windows-x64.exe
            attestation-bun-windows-x64.json

  publish:
    needs: [authorize, linux, macos, windows]
    if: needs.authorize.outputs.skip != 'true'
    concurrency:
      group: release-${{ needs.authorize.outputs.tag }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.authorize.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      # oven-sh/setup-bun v2.2.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile --no-progress
      # actions/download-artifact v4.3.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: release-*
          path: dist-assets
          merge-multiple: true
      - name: Assemble and validate the exact release tuple
        env:
          RELEASE_TAG: ${{ needs.authorize.outputs.tag }}
          SOURCE_SHA: ${{ needs.authorize.outputs.sha }}
        run: |
          set -euo pipefail
          bun scripts/release.ts assemble \
            --tag "$RELEASE_TAG" \
            --commit-sha "$SOURCE_SHA" \
            --artifacts-dir dist-assets \
            --output-dir release-assets
          sh -n release-assets/install.sh
      - name: Publish the immutable tuple
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.authorize.outputs.tag }}
          SOURCE_SHA: ${{ needs.authorize.outputs.sha }}
          CREATE_TAG: ${{ needs.authorize.outputs.create_tag }}
        run: |
          set -euo pipefail
          create_tag=$CREATE_TAG
          case "$create_tag" in
            true|false) ;;
            *) echo "CREATE_TAG must be exactly true or false." >&2; exit 1 ;;
          esac
          publish_work="$(mktemp -d)"
          trap 'find "$publish_work" -depth -delete' EXIT
          resolve_tag_commit() {
            tag_name=$1
            error_file=$2
            : > "$error_file"
            if ! ref_object=$(
              gh api \
                "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag_name" \
                --jq '.object.type + " " + .object.sha' 2> "$error_file"
            ); then
              if grep -q "HTTP 404" "$error_file"; then
                return 2
              fi
              return 1
            fi
            object_type=${ref_object%% *}
            object_sha=${ref_object#* }
            if [ "$object_type" = "tag" ]; then
              if ! tag_object=$(
                gh api \
                  "repos/$GITHUB_REPOSITORY/git/tags/$object_sha" \
                  --jq '.object.type + " " + .object.sha' 2>> "$error_file"
              ); then
                return 1
              fi
              object_type=${tag_object%% *}
              object_sha=${tag_object#* }
            fi
            if [ "$object_type" != "commit" ]; then
              echo "Tag $tag_name does not resolve directly to a commit." > "$error_file"
              return 1
            fi
            test "${#object_sha}" -eq 40 ||
              { echo "Tag $tag_name resolved to an invalid commit SHA." > "$error_file"; return 1; }
            case "$object_sha" in
              *[!a-f0-9]*) echo "Tag $tag_name resolved to an invalid commit SHA." > "$error_file"; return 1 ;;
            esac
            printf '%s\n' "$object_sha"
          }

          tag_probe_error="$publish_work/tag-probe.error"
          verify_release_tag() {
            if ! observed_tag_sha=$(
              resolve_tag_commit "$RELEASE_TAG" "$tag_probe_error"
            ); then
              cat "$tag_probe_error" >&2
              echo "Could not resolve release tag $RELEASE_TAG." >&2
              exit 1
            fi
            test "$observed_tag_sha" = "$SOURCE_SHA" ||
              { echo "Release tag moved after authorization" >&2; exit 1; }
          }

          if observed_tag_sha=$(
            resolve_tag_commit "$RELEASE_TAG" "$tag_probe_error"
          ); then
            test "$observed_tag_sha" = "$SOURCE_SHA" ||
              { echo "Release tag moved after authorization" >&2; exit 1; }
          else
            probe_status=$?
            if [ "$probe_status" -ne 2 ]; then
              cat "$tag_probe_error" >&2
              echo "Could not resolve release tag $RELEASE_TAG." >&2
              exit 1
            fi
            if [ "$create_tag" != "true" ]; then
              echo "Release tag $RELEASE_TAG disappeared after authorization." >&2
              exit 1
            fi

            tag_create_error="$publish_work/tag-create.error"
            if ! gh api \
              --method POST \
              "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$RELEASE_TAG" \
              -f "sha=$SOURCE_SHA" \
              > /dev/null 2> "$tag_create_error"
            then
              # A concurrent exact tag creation is safe; every other failure
              # remains observable and stops before release mutation.
              if observed_tag_sha=$(
                resolve_tag_commit "$RELEASE_TAG" "$tag_probe_error"
              ); then
                test "$observed_tag_sha" = "$SOURCE_SHA" ||
                  { echo "Release tag moved after authorization" >&2; exit 1; }
              else
                cat "$tag_create_error" >&2
                cat "$tag_probe_error" >&2
                echo "Could not create release tag $RELEASE_TAG." >&2
                exit 1
              fi
            else
              verify_release_tag
            fi
          fi
          tag_without_build="${RELEASE_TAG%%+*}"
          expected_prerelease=false
          case "$tag_without_build" in
            *-*) expected_prerelease=true ;;
          esac

          release_json="$publish_work/release.json"
          release_error="$publish_work/release.error"
          local_names="$publish_work/local-names"
          remote_names="$publish_work/remote-names"
          download_dir="$publish_work/downloads"
          mkdir "$download_dir"
          find release-assets -maxdepth 1 -type f -printf '%f\n' |
            LC_ALL=C sort > "$local_names"

          fetch_release() {
            gh api \
              "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
              > "$release_json" 2> "$release_error"
          }

          validate_release_identity() {
            mapfile -t identity < <(
              bun -e '
                import { readFileSync } from "node:fs";
                const release = JSON.parse(readFileSync(process.argv[1], "utf8"));
                console.log(release.tag_name);
                console.log(String(release.draft));
                console.log(release.name);
                console.log(String(release.prerelease));
              ' "$release_json"
            )
            test "${identity[0]}" = "$RELEASE_TAG" ||
              { echo "Existing release tag does not match the requested tag" >&2; exit 1; }
            release_is_draft="${identity[1]}"
            test "${identity[2]}" = "$RELEASE_TAG" ||
              { echo "Existing release title does not match the requested tag" >&2; exit 1; }
            test "${identity[3]}" = "$expected_prerelease" ||
              { echo "Existing release prerelease classification is incorrect" >&2; exit 1; }
          }

          verify_remote_assets() {
            require_complete=$1
            bun -e '
              import { readFileSync } from "node:fs";
              const release = JSON.parse(readFileSync(process.argv[1], "utf8"));
              for (const asset of release.assets.map((asset) => asset.name).sort()) {
                console.log(asset);
              }
            ' "$release_json" > "$remote_names"
            find "$download_dir" -mindepth 1 -depth -delete
            while IFS= read -r asset; do
              test -n "$asset" || continue
              case "$asset" in
                */*|*\\*|.*) echo "Existing draft contains an unsafe asset name: $asset" >&2; exit 1 ;;
              esac
              test -f "release-assets/$asset" ||
                { echo "Existing release contains an unexpected asset: $asset" >&2; exit 1; }
              gh release download "$RELEASE_TAG" \
                --pattern "$asset" \
                --dir "$download_dir"
              cmp -s "release-assets/$asset" "$download_dir/$asset" ||
                { echo "Existing release asset differs from the authorized tuple: $asset" >&2; exit 1; }
            done < "$remote_names"
            if [ "$require_complete" = "true" ]; then
              cmp -s "$local_names" "$remote_names" ||
                { echo "Existing release does not contain the complete authorized asset set" >&2; exit 1; }
            fi
          }

          if fetch_release; then
            validate_release_identity
          elif grep -q "HTTP 404" "$release_error"; then
            prerelease=()
            if [ "$expected_prerelease" = "true" ]; then
              prerelease=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --draft \
              --target "$SOURCE_SHA" \
              --title "$RELEASE_TAG" \
              "${prerelease[@]}"
            verify_release_tag
            fetch_release
            validate_release_identity
          else
            cat "$release_error" >&2
            exit 1
          fi

          verify_release_tag

          if [ "$release_is_draft" = "false" ]; then
            verify_remote_assets true
            verify_release_tag
            echo "Release $RELEASE_TAG is already published with the authorized tuple."
            exit 0
          fi

          verify_remote_assets false
          missing_assets=()
          while IFS= read -r asset; do
            grep -Fxq "$asset" "$remote_names" ||
              missing_assets+=("release-assets/$asset")
          done < "$local_names"
          if [ "${#missing_assets[@]}" -gt 0 ]; then
            gh release upload "$RELEASE_TAG" "${missing_assets[@]}"
          fi

          fetch_release
          validate_release_identity
          test "$release_is_draft" = "true" ||
            { echo "Release publication state changed concurrently" >&2; exit 1; }
          verify_remote_assets true
          verify_release_tag
          gh release edit "$RELEASE_TAG" --draft=false
          fetch_release
          validate_release_identity
          test "$release_is_draft" = "false" ||
            { echo "Release remained a draft after publication" >&2; exit 1; }
          verify_remote_assets true
          verify_release_tag
