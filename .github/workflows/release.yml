name: release

# Build and publish an exact, manifest-bound release tuple:
#   - a v* tag push releases that package-matching tag;
#   - a main push releases v<package version> only when that tag is absent;
#   - a manual dispatch rebuilds or resumes an existing package-matching tag.
on:
  push:
    tags: ["v*"]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing package-matching tag to release (for example v0.4.6)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  authorize:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.verify.outputs.tag }}
      sha: ${{ steps.verify.outputs.sha }}
      skip: ${{ steps.verify.outputs.skip }}
      create_tag: ${{ steps.verify.outputs.create_tag }}
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      # oven-sh/setup-bun v2.2.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - id: verify
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          REQUESTED_TAG: ${{ inputs.tag }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_SERVER_URL" != "https://github.com" ] ||
             [ "$GITHUB_API_URL" != "https://api.github.com" ]; then
            echo "This release workflow has no reviewed GitHub host authority for the active context." >&2
            exit 1
          fi
          repository_owner="${GITHUB_REPOSITORY%%/*}"
          repository_name="${GITHUB_REPOSITORY#*/}"
          if [ -z "$repository_owner" ] ||
             [ -z "$repository_name" ] ||
             [ "$repository_owner" = "$GITHUB_REPOSITORY" ] ||
             [ "$repository_name" = "." ] ||
             [ "$repository_name" = ".." ] ||
             [ "$repository_owner" = "." ] ||
             [ "$repository_owner" = ".." ]; then
            echo "GitHub did not provide an exact repository authority." >&2
            exit 1
          fi
          case "$repository_owner$repository_name" in
            *[!A-Za-z0-9_.-]*)
              echo "GitHub repository authority contains unsupported characters." >&2
              exit 1
              ;;
          esac
          export GH_HOST=github.com
          package_tag="v$(bun -e 'import p from "./package.json"; process.stdout.write(p.version)')"
          source_sha="$(git rev-parse HEAD)"
          test "${#source_sha}" -eq 40 ||
            { echo "Resolved source commit is not a full SHA" >&2; exit 1; }
          case "$source_sha" in
            *[!a-f0-9]*) echo "Resolved source commit is not lowercase hexadecimal" >&2; exit 1 ;;
          esac

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            release_tag=$REQUESTED_TAG
          elif [ "$REF_TYPE" = "tag" ]; then
            release_tag=$REF_NAME
          else
            release_tag=$package_tag
          fi

          test "$release_tag" = "$package_tag" ||
            { echo "Tag $release_tag does not match package version $package_tag" >&2; exit 1; }

          tag_probe_error="$(mktemp)"
          trap 'rm -f "$tag_probe_error"' EXIT
          resolve_tag_commit() {
            tag_name=$1
            error_file=$2
            : > "$error_file"
            if ! ref_object=$(
              gh api \
                --hostname github.com \
                "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag_name" \
                --jq '.object.type + " " + .object.sha' 2> "$error_file"
            ); then
              if grep -q "HTTP 404" "$error_file"; then
                return 2
              fi
              return 1
            fi
            object_type=${ref_object%% *}
            object_sha=${ref_object#* }
            if [ "$object_type" = "tag" ]; then
              if ! tag_object=$(
                gh api \
                  --hostname github.com \
                  "repos/$GITHUB_REPOSITORY/git/tags/$object_sha" \
                  --jq '.object.type + " " + .object.sha' 2>> "$error_file"
              ); then
                return 1
              fi
              object_type=${tag_object%% *}
              object_sha=${tag_object#* }
            fi
            if [ "$object_type" != "commit" ]; then
              echo "Tag $tag_name does not resolve directly to a commit." > "$error_file"
              return 1
            fi
            test "${#object_sha}" -eq 40 ||
              { echo "Tag $tag_name resolved to an invalid commit SHA." > "$error_file"; return 1; }
            case "$object_sha" in
              *[!a-f0-9]*) echo "Tag $tag_name resolved to an invalid commit SHA." > "$error_file"; return 1 ;;
            esac
            printf '%s\n' "$object_sha"
          }

          tag_exists=false
          remote_tag_sha=""
          if remote_tag_sha=$(
            resolve_tag_commit "$release_tag" "$tag_probe_error"
          ); then
            tag_exists=true
          else
            probe_status=$?
            if [ "$probe_status" -ne 2 ]; then
              cat "$tag_probe_error" >&2
              echo "Could not determine whether $release_tag already exists." >&2
              exit 1
            fi
          fi

          create_tag=false
          if [ "$EVENT_NAME" = "push" ] && [ "$REF_TYPE" = "branch" ]; then
            if [ "$tag_exists" = "true" ]; then
              echo "$release_tag already exists; this main push has no new package version."
              echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
              echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "create_tag=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            create_tag=true
          else
            [ "$tag_exists" = "true" ] ||
              { echo "$release_tag is not an existing tag" >&2; exit 1; }
            test "$source_sha" = "$remote_tag_sha" ||
              { echo "Checkout is not the exact requested tag commit" >&2; exit 1; }
          fi

          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "create_tag=$create_tag" >> "$GITHUB_OUTPUT"

  quality:
    needs: authorize
    if: needs.authorize.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.authorize.outputs.sha }}
          persist-credentials: false
      # oven-sh/setup-bun v2.2.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile --no-progress
      - name: Run the full quality gate
        run: bun run check

  linux:
    needs: authorize
    if: needs.authorize.outputs.skip != 'true'
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-linux-x64
            runner: ubuntu-24.04
            asset: sana-mcp-linux-x64
            libc: glibc
          - target: bun-linux-x64-musl
            runner: ubuntu-24.04
            asset: sana-mcp-linux-x64-musl
            libc: musl
          - target: bun-linux-arm64
            runner: ubuntu-24.04-arm
            asset: sana-mcp-linux-arm64
            libc: glibc
          - target: bun-linux-arm64-musl
            runner: ubuntu-24.04-arm
            asset: sana-mcp-linux-arm64-musl
            libc: musl
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.authorize.outputs.sha }}
          persist-credentials: false
      # oven-sh/setup-bun v2.2.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile --no-progress
      - name: Build through canonical release configuration
        run: bun scripts/release.ts build --target "${{ matrix.target }}" --outfile "${{ matrix.asset }}"
      - name: Smoke check and attest
        env:
          TARGET: ${{ matrix.target }}
          ASSET: ${{ matrix.asset }}
          LIBC: ${{ matrix.libc }}
          SOURCE_SHA: ${{ needs.authorize.outputs.sha }}
        run: |
          set -euo pipefail
          chmod +x "$ASSET"
          PACKAGE_VERSION="$(bun -e 'process.stdout.write(require("./package.json").version)')"
          EXECUTED_SHA256="$(sha256sum "$ASSET" | awk '{print $1}')"
          if [ "$LIBC" = musl ]; then
            docker run --rm -v "$PWD/$ASSET:/execution/artifact:ro" -w /execution \
              -e "EXPECTED_SHA256=$EXECUTED_SHA256" -e "PACKAGE_VERSION=$PACKAGE_VERSION" \
              alpine:3.22@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce \
              sh -eu -c '
                apk add --no-cache libstdc++ libgcc >/dev/null
                [ "$(sha256sum "$1" | awk "{print \$1}")" = "$EXPECTED_SHA256" ]
                [ "$("$1" --version)" = "$PACKAGE_VERSION" ]
                "$1" --help >/dev/null
                "$1" __inspect --format json
              ' _ /execution/artifact > "inspect-$TARGET.json"
          else
            [ "$("$ASSET" --version)" = "$PACKAGE_VERSION" ]
            "$ASSET" --help >/dev/null
            "$ASSET" __inspect --format json > "inspect-$TARGET.json"
          fi
          [ "$(sha256sum "$ASSET" | awk '{print $1}')" = "$EXECUTED_SHA256" ]
          bun scripts/release.ts attest \
            --target "$TARGET" \
            --artifact "$ASSET" \
            --inspect-file "inspect-$TARGET.json" \
            --commit-sha "$SOURCE_SHA" \
            --executed-sha256 "$EXECUTED_SHA256" \
            --output "attestation-$TARGET.json"
      # actions/upload-artifact v4.6.2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 1
          path: |
            ${{ matrix.asset }}
            attestation-${{ matrix.target }}.json

  macos:
    needs: authorize
    if: needs.authorize.outputs.skip != 'true'
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-darwin-x64
            runner: macos-15-intel
            asset: sana-mcp-darwin-x64
          - target: bun-darwin-arm64
            runner: macos-15
            asset: sana-mcp-darwin-arm64
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.authorize.outputs.sha }}
          persist-credentials: false
      # oven-sh/setup-bun v2.2.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile --no-progress
      - name: Build through canonical release configuration
        run: bun scripts/release.ts build --target "${{ matrix.target }}" --outfile "${{ matrix.asset }}"
      - name: Smoke check and attest
        env:
          TARGET: ${{ matrix.target }}
          ASSET: ${{ matrix.asset }}
          SOURCE_SHA: ${{ needs.authorize.outputs.sha }}
        run: |
          set -euo pipefail
          chmod +x "$ASSET"
          PACKAGE_VERSION="$(bun -e 'process.stdout.write(require("./package.json").version)')"
          EXECUTED_SHA256="$(shasum -a 256 "$ASSET" | awk '{print $1}')"
          [ "$("$ASSET" --version)" = "$PACKAGE_VERSION" ]
          "$ASSET" --help >/dev/null
          "$ASSET" __inspect --format json > "inspect-$TARGET.json"
          [ "$(shasum -a 256 "$ASSET" | awk '{print $1}')" = "$EXECUTED_SHA256" ]
          bun scripts/release.ts attest \
            --target "$TARGET" \
            --artifact "$ASSET" \
            --inspect-file "inspect-$TARGET.json" \
            --commit-sha "$SOURCE_SHA" \
            --executed-sha256 "$EXECUTED_SHA256" \
            --output "attestation-$TARGET.json"
      # actions/upload-artifact v4.6.2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 1
          path: |
            ${{ matrix.asset }}
            attestation-${{ matrix.target }}.json

  windows:
    needs: authorize
    if: needs.authorize.outputs.skip != 'true'
    name: bun-windows-x64
    runs-on: windows-2022
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.authorize.outputs.sha }}
          persist-credentials: false
      # oven-sh/setup-bun v2.2.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile --no-progress
      - name: Validate the Windows installer syntax
        shell: powershell
        run: |
          $Tokens = $null
          $Errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD "install.ps1"),
            [ref] $Tokens,
            [ref] $Errors
          ) | Out-Null
          if ($Errors.Count -gt 0) {
            $Errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - name: Build through canonical release configuration
        run: bun scripts/release.ts build --target bun-windows-x64 --outfile sana-mcp-windows-x64.exe
      - name: Smoke check and attest
        shell: powershell
        env:
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
          SOURCE_SHA: ${{ needs.authorize.outputs.sha }}
        run: |
          $ErrorActionPreference = "Stop"
          $Binary = Join-Path $PWD "sana-mcp-windows-x64.exe"
          $PackageVersion = (Get-Content -LiteralPath (Join-Path $PWD "package.json") -Raw |
            ConvertFrom-Json).version
          $InspectPath = Join-Path $PWD "inspect-bun-windows-x64.json"
          $AttestationPath = Join-Path $PWD "attestation-bun-windows-x64.json"
          $ExecutedSha256 = (Get-FileHash -LiteralPath $Binary -Algorithm SHA256).Hash.ToLower()
          $ObservedVersion = (& $Binary --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $ObservedVersion -cne $PackageVersion) {
            throw "Standalone version mismatch: expected $PackageVersion, received $ObservedVersion."
          }
          $InspectJson = (& $Binary __inspect --format json | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw "Standalone inspect failed: $LASTEXITCODE" }
          [IO.File]::WriteAllText($InspectPath, $InspectJson + "`n", [Text.UTF8Encoding]::new($false))
          $Inspect = $InspectJson | ConvertFrom-Json
          $InspectNames = @($Inspect.PSObject.Properties.Name | Sort-Object)
          $ExpectedNames = @(
            "inspectProtocol","installerProtocol","lifecycleProtocol","mode",
            "semanticCapability","standalone","stateCompatibility","target","version"
          ) | Sort-Object
          if ((Compare-Object $ExpectedNames $InspectNames).Count -ne 0 -or
              $Inspect.mode -cne "standalone" -or $Inspect.standalone -cne $true -or
              $Inspect.version -cne $PackageVersion -or $Inspect.target -cne "bun-windows-x64" -or
              $Inspect.installerProtocol -ne 1 -or $Inspect.lifecycleProtocol -ne 1 -or
              $Inspect.inspectProtocol -ne 1 -or $Inspect.stateCompatibility -ne 1 -or
              $Inspect.semanticCapability -cne "keyword") {
            throw "Standalone inspect tuple is not the exact Windows release identity."
          }
          & $Binary --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Standalone help smoke check failed: $LASTEXITCODE" }
          if ((Get-FileHash -LiteralPath $Binary -Algorithm SHA256).Hash.ToLower() -cne $ExecutedSha256) {
            throw "Release artifact changed while executing smoke checks."
          }
          $AttestArguments = @(
            "scripts/release.ts","attest",
            "--target","bun-windows-x64",
            "--artifact",$Binary,
            "--inspect-file",$InspectPath,
            "--commit-sha",$env:SOURCE_SHA,
            "--executed-sha256",$ExecutedSha256,
            "--output",$AttestationPath
          )
          & bun @AttestArguments
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $AttestationPath -PathType Leaf)) {
            throw "Attestation creation failed: $LASTEXITCODE"
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-bun-windows-x64
          if-no-files-found: error
          retention-days: 1
          path: |
            sana-mcp-windows-x64.exe
            attestation-bun-windows-x64.json

  publish:
    needs: [authorize, quality, linux, macos, windows]
    if: needs.authorize.outputs.skip != 'true'
    concurrency:
      group: release-${{ needs.authorize.outputs.tag }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.authorize.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      # oven-sh/setup-bun v2.2.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile --no-progress
      # actions/download-artifact v4.3.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: release-*
          path: dist-assets
          merge-multiple: true
      - name: Assemble and validate the exact release tuple
        env:
          RELEASE_TAG: ${{ needs.authorize.outputs.tag }}
          SOURCE_SHA: ${{ needs.authorize.outputs.sha }}
        run: |
          set -euo pipefail
          bun scripts/release.ts assemble \
            --tag "$RELEASE_TAG" \
            --commit-sha "$SOURCE_SHA" \
            --artifacts-dir dist-assets \
            --output-dir release-assets
          sh -n release-assets/install.sh
      - name: Publish the immutable tuple
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.authorize.outputs.tag }}
          SOURCE_SHA: ${{ needs.authorize.outputs.sha }}
          CREATE_TAG: ${{ needs.authorize.outputs.create_tag }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          EXPECTED_UPLOAD_ORIGIN: ${{ github.server_url == 'https://github.com' && 'https://uploads.github.com' || '' }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_SERVER_URL" != "https://github.com" ] ||
             [ "$GITHUB_API_URL" != "https://api.github.com" ]; then
            echo "This release workflow has no reviewed upload-origin authority for the active GitHub context." >&2
            exit 1
          fi
          test -n "$EXPECTED_UPLOAD_ORIGIN" ||
            { echo "GitHub did not provide the reviewed upload-origin authority." >&2; exit 1; }
          repository_owner="${GITHUB_REPOSITORY%%/*}"
          repository_name="${GITHUB_REPOSITORY#*/}"
          if [ -z "$repository_owner" ] ||
             [ -z "$repository_name" ] ||
             [ "$repository_owner" = "$GITHUB_REPOSITORY" ] ||
             [ "$repository_name" = "." ] ||
             [ "$repository_name" = ".." ] ||
             [ "$repository_owner" = "." ] ||
             [ "$repository_owner" = ".." ]; then
            echo "GitHub did not provide an exact repository authority." >&2
            exit 1
          fi
          case "$repository_owner$repository_name" in
            *[!A-Za-z0-9_.-]*)
              echo "GitHub repository authority contains unsupported characters." >&2
              exit 1
              ;;
          esac
          expected_upload_origin=$EXPECTED_UPLOAD_ORIGIN
          export GH_HOST=github.com
          create_tag=$CREATE_TAG
          case "$create_tag" in
            true|false) ;;
            *) echo "CREATE_TAG must be exactly true or false." >&2; exit 1 ;;
          esac
          publish_work="$(mktemp -d)"
          trap 'chmod -R u+w "$publish_work"; find "$publish_work" -depth -delete' EXIT
          authorized_assets="$publish_work/authorized-assets"
          mkdir "$authorized_assets"
          cp -a release-assets/. "$authorized_assets/"
          chmod -R a-w "$authorized_assets"
          authority_json="$publish_work/authority.json"
          if ! bun "$GITHUB_WORKSPACE/scripts/release.ts" assembled-authority \
            --tag "$RELEASE_TAG" \
            --commit-sha "$SOURCE_SHA" \
            --dir "$authorized_assets" \
            > "$authority_json"
          then
            echo "Could not establish the complete assembled release authority." >&2
            exit 1
          fi
          test -s "$authority_json" ||
            { echo "Assembled release authority is empty." >&2; exit 1; }
          authority_lines_file="$publish_work/authority-lines"
          if ! bun -e '
            import { readFileSync } from "node:fs";
            import path from "node:path";
            import { pathToFileURL } from "node:url";
            const input = readFileSync(process.argv[1], "utf8");
            const authority = JSON.parse(input);
            const contract = await import(
              pathToFileURL(
                path.join(process.argv[2], "src/release/contract.ts"),
              ).href
            );
            const expectedNames = [
              "install.ps1",
              "install.ps1.sha256",
              "install.sh",
              "install.sh.sha256",
              "manifest.json",
              "manifest.json.sha256",
              "manifest.schema.json",
              ...contract.RELEASE_TARGETS.flatMap((target) => {
                const asset = contract.releaseAssetName(target);
                const metadata = contract.releaseMetadataFileName(target);
                return [
                  `attestation-${target}.json`,
                  asset,
                  `${asset}.sha256`,
                  metadata,
                  `${metadata}.sha256`,
                ];
              }),
            ].sort((left, right) => left.localeCompare(right, "en"));
            if (
              authority === null ||
              typeof authority !== "object" ||
              Array.isArray(authority) ||
              Object.keys(authority).sort().join(",") !==
                "authorityVersion,files,releaseTag,sourceCommit" ||
              authority.authorityVersion !== 1 ||
              authority.releaseTag !== process.env.RELEASE_TAG ||
              authority.sourceCommit !== process.env.SOURCE_SHA ||
              !Array.isArray(authority.files) ||
              authority.files.length !== expectedNames.length ||
              input !== `${JSON.stringify(authority)}\n`
            ) throw new Error("assembled authority envelope is invalid");
            for (const [index, file] of authority.files.entries()) {
              if (
                file === null ||
                typeof file !== "object" ||
                Array.isArray(file) ||
                Object.keys(file).sort().join(",") !== "name,sha256" ||
                file.name !== expectedNames[index] ||
                !/^[a-f0-9]{64}$/.test(file.sha256)
              ) throw new Error("assembled authority file tuple is invalid");
              console.log(`${file.sha256}\t${file.name}`);
            }
          ' "$authority_json" "$GITHUB_WORKSPACE" > "$authority_lines_file"
          then
            rm -f "$authority_lines_file"
            echo "Could not validate the complete assembled release authority." >&2
            exit 1
          fi
          test -s "$authority_lines_file" ||
            { echo "Validated assembled release inventory is empty." >&2; exit 1; }
          local_names="$publish_work/local-names"
          : > "$local_names"
          declare -A expected_digests
          declare -A asset_descriptors
          mapfile -t authority_lines < "$authority_lines_file"
          reset_asset_descriptor() {
            descriptor=$1
            perl -e '
              use Fcntl qw(SEEK_SET);
              defined(sysseek(STDIN, 0, SEEK_SET)) or die "descriptor seek failed: $!\n";
            ' <&"$descriptor"
          }
          for authority_line in "${authority_lines[@]}"; do
            IFS=$'\t' read -r digest asset extra <<< "$authority_line"
            test -n "$digest" && test -n "$asset" && test -z "${extra-}" ||
              { echo "Assembled authority line has no delimiter." >&2; exit 1; }
            printf '%s\n' "$asset" >> "$local_names"
            exec {asset_fd}<"$authorized_assets/$asset"
            reset_asset_descriptor "$asset_fd"
            descriptor_digest="$(sha256sum "/proc/self/fd/$asset_fd" | awk '{print $1}')"
            test "$descriptor_digest" = "$digest" ||
              { echo "Publication descriptor differs from assembled authority: $asset" >&2; exit 1; }
            expected_digests["$asset"]=$digest
            asset_descriptors["$asset"]=$asset_fd
          done
          resolve_tag_commit() {
            tag_name=$1
            error_file=$2
            : > "$error_file"
            if ! ref_object=$(
              gh api \
                --hostname github.com \
                "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag_name" \
                --jq '.object.type + " " + .object.sha' 2> "$error_file"
            ); then
              if grep -q "HTTP 404" "$error_file"; then
                return 2
              fi
              return 1
            fi
            object_type=${ref_object%% *}
            object_sha=${ref_object#* }
            if [ "$object_type" = "tag" ]; then
              if ! tag_object=$(
                gh api \
                  --hostname github.com \
                  "repos/$GITHUB_REPOSITORY/git/tags/$object_sha" \
                  --jq '.object.type + " " + .object.sha' 2>> "$error_file"
              ); then
                return 1
              fi
              object_type=${tag_object%% *}
              object_sha=${tag_object#* }
            fi
            if [ "$object_type" != "commit" ]; then
              echo "Tag $tag_name does not resolve directly to a commit." > "$error_file"
              return 1
            fi
            test "${#object_sha}" -eq 40 ||
              { echo "Tag $tag_name resolved to an invalid commit SHA." > "$error_file"; return 1; }
            case "$object_sha" in
              *[!a-f0-9]*) echo "Tag $tag_name resolved to an invalid commit SHA." > "$error_file"; return 1 ;;
            esac
            printf '%s\n' "$object_sha"
          }

          tag_probe_error="$publish_work/tag-probe.error"
          verify_release_tag() {
            if ! observed_tag_sha=$(
              resolve_tag_commit "$RELEASE_TAG" "$tag_probe_error"
            ); then
              cat "$tag_probe_error" >&2
              echo "Could not resolve release tag $RELEASE_TAG." >&2
              exit 1
            fi
            test "$observed_tag_sha" = "$SOURCE_SHA" ||
              { echo "Release tag moved after authorization" >&2; exit 1; }
          }

          verify_created_release_tag() {
            tag_probe=1
            while :; do
              if observed_tag_sha=$(
                resolve_tag_commit "$RELEASE_TAG" "$tag_probe_error"
              ); then
                test "$observed_tag_sha" = "$SOURCE_SHA" ||
                  { echo "Release tag moved after authorization" >&2; exit 1; }
                return 0
              else
                tag_status=$?
              fi
              if [ "$tag_status" -ne 2 ] || [ "$tag_probe" -ge 10 ]; then
                cat "$tag_probe_error" >&2
                if [ "$tag_status" -eq 2 ]; then
                  echo "Release tag $RELEASE_TAG did not become visible after creation." >&2
                else
                  echo "Could not resolve release tag $RELEASE_TAG after creation." >&2
                fi
                exit 1
              fi
              tag_probe=$((tag_probe + 1))
              sleep 1
            done
          }

          if observed_tag_sha=$(
            resolve_tag_commit "$RELEASE_TAG" "$tag_probe_error"
          ); then
            test "$observed_tag_sha" = "$SOURCE_SHA" ||
              { echo "Release tag moved after authorization" >&2; exit 1; }
          else
            probe_status=$?
            if [ "$probe_status" -ne 2 ]; then
              cat "$tag_probe_error" >&2
              echo "Could not resolve release tag $RELEASE_TAG." >&2
              exit 1
            fi
            if [ "$create_tag" != "true" ]; then
              echo "Release tag $RELEASE_TAG disappeared after authorization." >&2
              exit 1
            fi

            tag_create_error="$publish_work/tag-create.error"
            if ! gh api \
              --hostname github.com \
              --method POST \
              "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$RELEASE_TAG" \
              -f "sha=$SOURCE_SHA" \
              > /dev/null 2> "$tag_create_error"
            then
              # A concurrent exact tag creation is safe; every other failure
              # remains observable and stops before release mutation.
              if observed_tag_sha=$(
                resolve_tag_commit "$RELEASE_TAG" "$tag_probe_error"
              ); then
                test "$observed_tag_sha" = "$SOURCE_SHA" ||
                  { echo "Release tag moved after authorization" >&2; exit 1; }
              else
                cat "$tag_create_error" >&2
                cat "$tag_probe_error" >&2
                echo "Could not create release tag $RELEASE_TAG." >&2
                exit 1
              fi
            else
              verify_created_release_tag
            fi
          fi
          tag_without_build="${RELEASE_TAG%%+*}"
          expected_prerelease=false
          case "$tag_without_build" in
            *-*) expected_prerelease=true ;;
          esac

          release_json="$publish_work/release.json"
          release_pages="$publish_work/release-pages.json"
          release_error="$publish_work/release.error"
          release_validation="$publish_work/release-validation"
          remote_names="$publish_work/remote-names"
          remote_assets="$publish_work/remote-assets"
          verified_asset_identity="$publish_work/verified-asset-identity"
          download_dir="$publish_work/downloads"
          mkdir "$download_dir"
          release_id=""

          fetch_release_by_tag() {
            : > "$release_error"
            if ! gh api \
              --hostname github.com \
              --paginate \
              "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --slurp \
              > "$release_pages" 2> "$release_error"
            then
              return 1
            fi
            bun -e '
              import { readFileSync } from "node:fs";
              const pages = JSON.parse(readFileSync(process.argv[1], "utf8"));
              const releaseTag = process.argv[2];
              const matches = pages.flat().filter(
                (release) => release.tag_name === releaseTag,
              );
              if (matches.length === 0) process.exit(4);
              if (matches.length !== 1) {
                console.error(`Multiple releases resolve to ${releaseTag}.`);
                process.exit(3);
              }
              process.stdout.write(JSON.stringify(matches[0]));
            ' "$release_pages" "$RELEASE_TAG" \
              > "$release_json" 2> "$release_error"
          }

          require_release_by_tag() {
            release_probe=1
            while :; do
              if fetch_release_by_tag; then
                return 0
              else
                release_status=$?
              fi
              if [ "$release_status" -ne 4 ] || [ "$release_probe" -ge 5 ]; then
                break
              fi
              release_probe=$((release_probe + 1))
              sleep 1
            done
            cat "$release_error" >&2
            if [ "$release_status" -eq 4 ]; then
              echo "Release $RELEASE_TAG disappeared during publication." >&2
            else
              echo "Could not resolve release $RELEASE_TAG during publication." >&2
            fi
            exit 1
          }

          validate_release_document() {
            expected_id=$1
            if ! bun -e '
              import { readFileSync } from "node:fs";
              const release = JSON.parse(readFileSync(process.argv[1], "utf8"));
              const expectedId = process.argv[2];
              const releaseTag = process.env.RELEASE_TAG;
              const repository = process.env.GITHUB_REPOSITORY;
              const expectedPrerelease = process.argv[3] === "true";
              const expectedApiUrl =
                `https://api.github.com/repos/${repository}/releases/${release?.id}`;
              const expectedUploadUrl =
                `${process.argv[4]}/repos/${repository}/releases/${release?.id}` +
                "/assets{?name,label}";
              if (
                release === null ||
                typeof release !== "object" ||
                Array.isArray(release) ||
                !Number.isSafeInteger(release.id) ||
                release.id <= 0 ||
                (expectedId !== "" && String(release.id) !== expectedId) ||
                typeof release.draft !== "boolean" ||
                typeof release.prerelease !== "boolean" ||
                release.url !== expectedApiUrl ||
                release.upload_url !== expectedUploadUrl ||
                !Array.isArray(release.assets)
              ) throw new Error("release identity document is invalid");
              if (release.tag_name !== releaseTag) {
                throw new Error("Existing release tag does not match the requested tag");
              }
              if (release.name !== releaseTag) {
                throw new Error("Existing release title does not match the requested tag");
              }
              if (release.prerelease !== expectedPrerelease) {
                throw new Error(
                  "Existing release prerelease classification is incorrect",
                );
              }
              const assetIds = new Set();
              const assetNames = new Set();
              for (const asset of release.assets) {
                if (
                  asset === null ||
                  typeof asset !== "object" ||
                  Array.isArray(asset) ||
                  !Number.isSafeInteger(asset.id) ||
                  asset.id <= 0 ||
                  !/^[A-Za-z0-9][A-Za-z0-9._-]{0,254}$/.test(asset.name) ||
                  asset.url !==
                    `https://api.github.com/repos/${repository}/releases/assets/${asset.id}` ||
                  assetIds.has(asset.id) ||
                  assetNames.has(asset.name)
                ) throw new Error("release asset identity document is invalid");
                assetIds.add(asset.id);
                assetNames.add(asset.name);
              }
              process.stdout.write(
                `${release.id}\n${release.draft ? "true" : "false"}\n`,
              );
            ' "$release_json" "$expected_id" "$expected_prerelease" \
              "$expected_upload_origin" > "$release_validation"
            then
              rm -f "$release_validation"
              echo "Existing release identity is invalid." >&2
              exit 1
            fi
            mapfile -t identity < "$release_validation"
            test "${#identity[@]}" -eq 2 &&
              case "${identity[0]}" in
                *[!0-9]*|"") false ;;
                *) true ;;
              esac &&
              case "${identity[1]}" in
                true|false) true ;;
                *) false ;;
              esac ||
              { echo "Release identity validation output is invalid." >&2; exit 1; }
            observed_release_id="${identity[0]}"
            release_is_draft="${identity[1]}"
          }

          pin_release_identity() {
            test -z "$release_id" ||
              { echo "Release identity was already pinned." >&2; exit 1; }
            validate_release_document ""
            release_id=$observed_release_id
          }

          validate_pinned_release_identity() {
            test -n "$release_id" ||
              { echo "Release identity has not been pinned." >&2; exit 1; }
            validate_release_document "$release_id"
            test "$observed_release_id" = "$release_id" ||
              { echo "Release identity changed concurrently." >&2; exit 1; }
          }

          fetch_pinned_release() {
            pinned_candidate="$publish_work/release-pinned-candidate.json"
            : > "$release_error"
            if ! gh api \
              --hostname github.com \
              "repos/$GITHUB_REPOSITORY/releases/$release_id" \
              > "$pinned_candidate" 2> "$release_error"
            then
              rm -f "$pinned_candidate"
              return 1
            fi
            mv "$pinned_candidate" "$release_json"
          }

          require_pinned_release() {
            if ! fetch_pinned_release; then
              cat "$release_error" >&2
              echo "Pinned release id $release_id is unavailable." >&2
              exit 1
            fi
            validate_pinned_release_identity
            verify_release_tag
          }

          derive_remote_asset_identity() {
            if ! bun -e '
              import { readFileSync } from "node:fs";
              const release = JSON.parse(readFileSync(process.argv[1], "utf8"));
              for (const asset of [...release.assets].sort((left, right) =>
                left.name.localeCompare(right.name, "en")
              )) {
                console.log(`${asset.id}\t${asset.name}`);
              }
            ' "$release_json" > "$remote_assets"
            then
              rm -f "$remote_assets"
              echo "Could not derive the pinned release asset inventory." >&2
              exit 1
            fi
            cut -f2 "$remote_assets" > "$remote_names"
          }

          verify_remote_assets() {
            require_complete=$1
            derive_remote_asset_identity
            find "$download_dir" -mindepth 1 -depth -delete
            while IFS=$'\t' read -r remote_asset_id asset extra; do
              test -n "$remote_asset_id" && test -n "$asset" &&
                test -z "${extra-}" ||
                { echo "Pinned release asset tuple is invalid." >&2; exit 1; }
              case "$asset" in
                */*|*\\*|.*) echo "Existing draft contains an unsafe asset name: $asset" >&2; exit 1 ;;
              esac
              test -n "${expected_digests[$asset]-}" ||
                { echo "Existing release asset has no immutable digest authority: $asset" >&2; exit 1; }
              gh api \
                --hostname github.com \
                -H "Accept: application/octet-stream" \
                "repos/$GITHUB_REPOSITORY/releases/assets/$remote_asset_id" \
                > "$download_dir/$asset"
              test "$(sha256sum "$download_dir/$asset" | awk '{print $1}')" = "${expected_digests[$asset]}" ||
                { echo "Existing release asset differs from the authorized tuple: $asset" >&2; exit 1; }
            done < "$remote_assets"
            if [ "$require_complete" = "true" ]; then
              cmp -s "$local_names" "$remote_names" ||
                { echo "Existing release does not contain the complete authorized asset set" >&2; exit 1; }
            fi
          }

          seal_verified_asset_identity() {
            test -s "$remote_assets" ||
              { echo "Verified release asset identity is empty." >&2; exit 1; }
            cp "$remote_assets" "$verified_asset_identity"
          }

          require_verified_asset_identity() {
            derive_remote_asset_identity
            cmp -s "$verified_asset_identity" "$remote_assets" ||
              { echo "Pinned release asset identities changed after verification." >&2; exit 1; }
          }

          contain_published_release() {
            containment_attempt=1
            while [ "$containment_attempt" -le 3 ]; do
              containment_response="$publish_work/release-containment-$containment_attempt.json"
              containment_error="$publish_work/release-containment-$containment_attempt.error"
              if (
                gh api \
                  --hostname github.com \
                  --method PATCH \
                  "repos/$GITHUB_REPOSITORY/releases/$release_id" \
                  -F draft=true \
                  > "$containment_response" 2> "$containment_error"
                fetch_pinned_release
                validate_pinned_release_identity
                test "$release_is_draft" = "true" ||
                  { echo "Pinned release id $release_id is not draft after containment." >&2; exit 1; }
              ); then
                return 0
              fi
              cat "$containment_error" >&2
              if [ "$containment_attempt" -lt 3 ]; then
                echo "Draft containment attempt $containment_attempt failed for pinned release id $release_id; retrying." >&2
                sleep 1
              fi
              containment_attempt=$((containment_attempt + 1))
            done
            echo "Publication state is unknown for pinned release id $release_id. Manually return this exact release id to draft before any retry." >&2
            return 1
          }

          if fetch_release_by_tag; then
            pin_release_identity
          else
            release_status=$?
            if [ "$release_status" -eq 4 ]; then
              prerelease=()
              if [ "$expected_prerelease" = "true" ]; then
                prerelease=(--prerelease)
              fi
              gh release create "$RELEASE_TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --verify-tag \
                --draft \
                --target "$SOURCE_SHA" \
                --title "$RELEASE_TAG" \
                "${prerelease[@]}"
              verify_release_tag
              require_release_by_tag
              pin_release_identity
            else
              cat "$release_error" >&2
              echo "Could not resolve release $RELEASE_TAG." >&2
              exit 1
            fi
          fi

          require_pinned_release

          if [ "$release_is_draft" = "false" ]; then
            if (
              verify_remote_assets true
              seal_verified_asset_identity
              require_pinned_release
              test "$release_is_draft" = "false" ||
                { echo "Published release became a draft concurrently." >&2; exit 1; }
              require_verified_asset_identity
            ); then
              echo "Release $RELEASE_TAG is already published with the authorized tuple."
              exit 0
            fi
            echo "Published release authority failed; enforcing draft containment." >&2
            if contain_published_release; then
              echo "Pinned release id $release_id was returned to draft containment." >&2
            else
              echo "Draft containment of pinned release id $release_id could not be verified." >&2
            fi
            exit 1
          fi

          verify_remote_assets false
          missing_assets=()
          while IFS= read -r asset; do
            grep -Fxq "$asset" "$remote_names" ||
              missing_assets+=("$asset")
          done < "$local_names"
          if [ "${#missing_assets[@]}" -gt 0 ]; then
            for asset in "${missing_assets[@]}"; do
              asset_fd=${asset_descriptors[$asset]-}
              test -n "$asset_fd" ||
                { echo "Missing asset has no publication descriptor: $asset" >&2; exit 1; }
              reset_asset_descriptor "$asset_fd"
              test "$(sha256sum "/proc/self/fd/$asset_fd" | awk '{print $1}')" = "${expected_digests[$asset]}" ||
                { echo "Publication descriptor changed before upload: $asset" >&2; exit 1; }
              reset_asset_descriptor "$asset_fd"
              bun "$GITHUB_WORKSPACE/scripts/release.ts" upload-asset \
                --release-json "$release_json" \
                --repository "$GITHUB_REPOSITORY" \
                --asset-name "$asset" \
                --fd "$asset_fd" \
                --expected-sha256 "${expected_digests[$asset]}" \
                --expected-origin "$expected_upload_origin"
            done
          fi

          require_pinned_release
          test "$release_is_draft" = "true" ||
            { echo "Release publication state changed concurrently" >&2; exit 1; }
          verify_remote_assets true
          seal_verified_asset_identity
          require_pinned_release
          test "$release_is_draft" = "true" ||
            { echo "Release publication state changed concurrently" >&2; exit 1; }
          require_verified_asset_identity
          if ! gh api \
              --hostname github.com \
              --method PATCH \
              "repos/$GITHUB_REPOSITORY/releases/$release_id" \
              -F draft=false \
              > "$publish_work/release-patch.json"
          then
            echo "Release publication update failed; enforcing draft containment." >&2
            if contain_published_release; then
              echo "Pinned release id $release_id was returned to draft containment." >&2
            else
              echo "Draft containment of pinned release id $release_id could not be verified." >&2
            fi
            exit 1
          fi
          if (
            require_pinned_release
            test "$release_is_draft" = "false" ||
              { echo "Release remained a draft after publication" >&2; exit 1; }
            require_verified_asset_identity
            verify_remote_assets true
            require_verified_asset_identity
            require_pinned_release
            test "$release_is_draft" = "false" ||
              { echo "Published release state changed concurrently" >&2; exit 1; }
            require_verified_asset_identity
          ); then
            :
          else
            echo "Post-publication authority failed; enforcing draft containment." >&2
            if ( contain_published_release ); then
              echo "Pinned release id $release_id was returned to draft containment." >&2
            else
              echo "Draft containment of pinned release id $release_id could not be verified." >&2
            fi
            exit 1
          fi
